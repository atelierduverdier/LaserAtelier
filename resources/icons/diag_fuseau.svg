<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90">
  <!-- Degrade le long du TRACE : le trait s'affine du debut vers la fin.
       Pas de chapeau sur les diag_* (cf. CLAUDE.md). -->
  <path d="M 26 30 L 246 42 L 246 48 L 26 60 Z" fill="#2f3540"/>
  <line x1="18" y1="30" x2="18" y2="60" stroke="#ff8a00" stroke-width="2.5"/>
  <line x1="254" y1="42" x2="254" y2="48" stroke="#ff8a00" stroke-width="2.5"/>
  <text x="18" y="22" font-family="sans-serif" font-size="11" fill="#ff8a00"
        text-anchor="middle">debut</text>
  <text x="256" y="22" font-family="sans-serif" font-size="11" fill="#ff8a00"
        text-anchor="middle">fin</text>
  <path d="M 264 45 L 284 45" stroke="#2f3540" stroke-width="2"/>
  <path d="M 284 41 L 294 45 L 284 49 Z" fill="#2f3540"/>
  <text x="150" y="78" font-family="sans-serif" font-size="11"
        fill="#ff8a00" text-anchor="middle">un seul trait : la largeur suit son parcours</text>
</svg>
