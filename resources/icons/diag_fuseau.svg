<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
  <!-- Degrade le long du TRACE : le trait s'affine du debut vers la fin. -->
  <!-- Pas de chapeau sur les diag_* (cf. CLAUDE.md). -->

  <!-- trait ouvert : fuseau franc, epais a gauche, fin a droite -->
  <path d="M 22 34 L 210 44 L 210 50 L 22 62 Z" fill="#2f3540"/>

  <!-- reperes de largeur -->
  <line x1="14" y1="34" x2="14" y2="62" stroke="#ff8a00" stroke-width="2.5"/>
  <line x1="218" y1="44" x2="218" y2="50" stroke="#ff8a00" stroke-width="2.5"/>
  <text x="14" y="26" font-family="sans-serif" font-size="12" fill="#ff8a00" text-anchor="middle">debut</text>
  <text x="222" y="26" font-family="sans-serif" font-size="12" fill="#ff8a00" text-anchor="middle">fin</text>

  <!-- sens de parcours -->
  <path d="M 236 47 L 262 47" stroke="#2f3540" stroke-width="2"/>
  <path d="M 262 42 L 274 47 L 262 52 Z" fill="#2f3540"/>

  <!-- boucle fermee : aller-retour, le trait revient a sa largeur de depart -->
  <text x="16" y="86" font-family="sans-serif" font-size="11" fill="#2f3540">boucle fermee, aller-retour :</text>
  <path d="M 150 108 C 176 108 190 100 202 100 C 214 100 228 108 254 108
           C 228 108 214 116 202 116 C 190 116 176 108 150 108 Z" fill="#2f3540"/>
  <circle cx="150" cy="108" r="3.5" fill="#ff8a00"/>
  <text x="140" y="112" font-family="sans-serif" font-size="10" fill="#ff8a00" text-anchor="end">depart</text>
</svg>
